name: Android app

on:
  push:
    branches: [main]
    paths: ['web/**', 'android-overrides/**', 'tools/android_assets.py', 'package.json', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Write app config
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: node tools/write_config.mjs

      - name: Create Android project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          pip install pillow
          python tools/android_assets.py
          npx cap sync android

      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          if [ -n "$KEYSTORE_B64" ]; then
            ./gradlew assembleRelease --no-daemon
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out ../Xenoreads.apk "$RUNNER_TEMP/aligned.apk"
            rm -f "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::No signing key secret. Built a debug APK; each build may need an uninstall before installing."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Xenoreads.apk
          fi

      - name: Publish to the "Android app" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Xenoreads for Android
          body: |
            Latest Android build (run ${{ github.run_number }}). Open this page on your phone, download Xenoreads.apk and install it.
            Updates install over the previous version and keep your downloads.
          files: Xenoreads.apk
          make_latest: true
