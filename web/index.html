<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11192C">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Xenoreads">
  <title>Xenoreads</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/newsreader-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Pick Day or Night before the first paint, so there is no flash of the wrong theme.
    try {
      var t = JSON.parse(localStorage.getItem('xr.settings') || '{}').theme || 'auto';
      var day = t === 'day' || (t === 'auto' && !matchMedia('(prefers-color-scheme: dark)').matches);
      if (day) document.documentElement.dataset.theme = 'light';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="ambient" class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

  <div id="app" class="app">
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <button id="mini" class="mini" hidden aria-label="Open player">
    <span class="mini-progress"><span></span></span>
    <span class="mini-cover"></span>
    <span class="mini-text">
      <span class="mini-title"></span>
      <span class="mini-line"></span>
    </span>
    <span class="mini-play icon-btn" role="button" aria-label="Play"></span>
  </button>

  <nav id="tabs" class="tabs" aria-label="Main">
    <a href="#/home" data-tab="home"><span class="ico" data-icon="home"></span><span>Home</span></a>
    <a href="#/explore" data-tab="explore"><span class="ico" data-icon="compass"></span><span>Explore</span></a>
    <a href="#/library" data-tab="library"><span class="ico" data-icon="library"></span><span>Library</span></a>
    <a href="#/saved" data-tab="saved"><span class="ico" data-icon="bookmark"></span><span>Saved</span></a>
  </nav>

  <section id="player" class="player" aria-hidden="true" aria-label="Now playing">
    <div class="player-bg" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="player-inner">
      <header class="player-top">
        <button class="icon-btn" data-act="close" aria-label="Close player"></button>
        <div class="player-where">
          <div class="pw-book"></div>
          <div class="pw-chapter"></div>
        </div>
        <button class="icon-btn" data-act="chapters" aria-label="Chapters"></button>
      </header>
      <div class="player-body">
        <div class="player-art">
          <div class="player-cover"></div>
          <div class="player-meta">
            <h2 class="pm-title"></h2>
            <p class="pm-author"></p>
          </div>
        </div>
        <div class="lyrics" tabindex="0" aria-label="Read along">
          <div class="lyrics-track"></div>
          <div class="lyrics-empty" hidden></div>
        </div>
        <button class="back-now" hidden>Back to now</button>
      </div>
      <footer class="player-controls">
        <div class="scrub" role="slider" aria-label="Position" tabindex="0">
          <div class="scrub-rail"><div class="scrub-fill"></div><div class="scrub-knob"></div></div>
          <div class="scrub-times"><span class="t-cur">0:00</span><span class="t-left">-0:00</span></div>
        </div>
        <div class="transport">
          <button class="icon-btn" data-act="prev" aria-label="Previous chapter"></button>
          <button class="icon-btn" data-act="back" aria-label="Back 15 seconds"></button>
          <button class="play-btn" data-act="toggle" aria-label="Play"></button>
          <button class="icon-btn" data-act="fwd" aria-label="Forward 30 seconds"></button>
          <button class="icon-btn" data-act="next" aria-label="Next chapter"></button>
        </div>
        <div class="player-tools">
          <button class="tool" data-act="speed">1×</button>
          <button class="tool" data-act="view"><span class="ico" data-icon="text"></span><span>Read along</span></button>
          <button class="tool" data-act="sleep"><span class="ico" data-icon="moon"></span><span class="sleep-label">Sleep</span></button>
          <button class="tool" data-act="mark" aria-label="Bookmark this moment"><span class="ico" data-icon="bookmark"></span></button>
        </div>
      </footer>
    </div>
  </section>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
